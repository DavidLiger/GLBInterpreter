name: Build & Deploy Dioramas

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 🔹 Vérifier le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 🔹 Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 🔹 Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 🔹 Vérifier la structure et générer les JSON
      - name: Generate Diorama JSON
        run: |
          echo "PWD: $(pwd)"
          echo "Listing content/webdioramas..."
          ls -R src/content/webdioramas || true

          echo "Running export-configs.ts..."
          npx ts-node scripts/export-configs.ts || true

          echo "Listing dist/manifests..."
          ls -R dist/manifests || true
        continue-on-error: true

      # 🔹 Uploader les JSON sur R2
      - name: Upload JSONs to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Listing JSONs to upload..."
          ls -R dist/manifests || true

          for f in dist/manifests/*/*.json; do
            book=$(basename $(dirname "$f"))
            file=$(basename "$f")
            echo "Uploading $file from book $book..."
            npx wrangler r2 object put "webdioramas/$book/$file" --file="$f" || true
          done
        continue-on-error: true

      # 🔹 Déployer sur Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v41.1.4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          prod: true
        continue-on-error: true
