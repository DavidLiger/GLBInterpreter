name: Build & Deploy Dioramas

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Vérifier l'arborescence (debug si nécessaire)
      - name: List webdioramas
        run: ls -R src/content/webdioramas

      # 5️⃣ Générer les JSON pour production
      - name: Generate Diorama JSON
        run: npx ts-node scripts/export-configs.ts

      # 6️⃣ Upload des JSON sur R2
      - name: Upload JSONs to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for f in dist/manifests/*/*.json; do
            bucket_path=$(echo $f | sed 's|dist/||')
            echo "Uploading $f to R2 at $bucket_path"
            npx wrangler r2 object put "webdioramas/$bucket_path" --file="$f"
          done

      # 7️⃣ Déploiement sur Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v41.1.4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'
