name: Build & Deploy Dioramas

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Générer les JSON de prod
      - name: Generate Diorama JSON
        run: npx ts-node scripts/export-configs.ts

      # 5️⃣ Vérifier que les fichiers sont bien générés
      - name: List generated JSON
        run: ls -R dist/manifests

      # 6️⃣ Upload sur R2
      - name: Upload JSONs to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for f in dist/manifests/*/*.json; do
            echo "Uploading $f to R2..."
            npx wrangler r2 object put "webdioramas/$(basename $(dirname $f))/$(basename $f)" \
              --file="$f" \
              --remote
          done