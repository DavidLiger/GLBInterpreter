name: Build & Deploy Dioramas

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Vérifier les fichiers TS de dioramas
      - name: Debug - List Diorama TS files
        run: |
          echo "Current dir:"
          pwd
          echo "Content dir:"
          ls -R src/content/webdioramas

      # 5️⃣ Générer les JSON
      - name: Generate Diorama JSON
        run: |
          npx ts-node scripts/export-configs.ts
          echo "Generated JSON files:"
          ls -R dist/manifests

      # 6️⃣ Upload JSONs vers R2
      - name: Upload JSONs to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for f in dist/manifests/*/*.json; do
            echo "Uploading $f ..."
            book=$(basename $(dirname $f))
            diorama=$(basename $f)
            npx wrangler r2 object put "webdioramas/$book/$diorama" --file="$f"
          done

      # 7️⃣ Déployer sur Vercel
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v41.1.4
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
